<style>
:root{--surface:#0E1220;--raised:#161B2E;--line:#262C44;--ink:#FFFFFF;--muted:#A3A9C2;--coral:#FF3D4A;color-scheme:dark}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--surface);color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
a{color:#FF7480}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
input,textarea{font-size:16px}
@keyframes slideInR{from{transform:translateX(32px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideUp{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--surface)}
#stage{width:390px;height:844px;flex:none;transform-origin:center center;position:relative}
#stage input,#stage textarea{font-size:15px}
#gear{position:fixed;right:6px;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:1000;width:28px;height:28px;border-radius:50%;border:none;background:rgba(22,27,46,.55);color:var(--muted);font-size:15px;line-height:28px;padding:0;opacity:.7}
#panel{position:fixed;inset:0;z-index:1001;background:rgba(14,18,32,.85);display:flex;align-items:flex-end;justify-content:center}
#panel[hidden]{display:none}
#panel .card{width:100%;max-width:420px;box-sizing:border-box;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:var(--raised);display:flex;flex-direction:column;gap:12px}
#panel h2{margin:0 0 4px;font-size:17px;font-weight:700}
#panel label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;min-height:44px;border-bottom:1px solid var(--line)}
#panel input{width:22px;height:22px;accent-color:var(--coral)}
#panel select{max-width:60%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;padding:0 8px}
#panel .card{max-height:90vh;overflow-y:auto}
#panel .row{display:flex;gap:10px;margin-top:8px}
#panel button{flex:1;height:48px;border-radius:999px;border:none;font-size:15px;font-weight:700}
#panel .pri{background:var(--coral);color:#12131F}
#panel .sec{background:transparent;border:1px solid var(--line) !important;color:var(--ink)}
#panel p{margin:0;font-size:13px;line-height:18px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important}}
</style>

</div>

<sc-if value="{{enDel}}" hint-placeholder-val="{{ false }}">

</sc-if>

<!-- ================= ПЕРВЫЙ ВХОД ================= -->

</div>

<sc-if value="{{cnsShow}}" hint-placeholder-val="{{ false }}">

<img src="{{r.img}}" alt="{{r.title}}" style="width: 88px; height: 110px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #161B2E">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex-grow: 1">
<div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
<span style="background: {{r.kindBg}}; color: {{r.kindFg}}; border-radius: 999px; padding: 2px 8px; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.04em">{{r.kind}}</span>
<sc-if value="{{r.mutual}}" hint-placeholder-val="{{ false }}"><span style="background: #5AC8FA; color: #12131F; border-radius: 999px; padding: 2px 8px; font-size: 12px; line-height: 16px; font-weight: 600">⇄ Взаимно</span></sc-if>
<sc-if value="{{r.surcharge}}" hint-placeholder-val="{{ false }}"><span style="width: 20px; height: 20px; border-radius: 999px; background: #FFB020; color: #12131F; display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 16px; font-weight: 800" aria-label="Возможна доплата баллами">Б</span></sc-if>
</div>
<span style="font-size: 15px; line-height: 20px; font-weight: 600">{{r.title}}</span>
<span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #A3A9C2">{{r.author}} · {{r.meta}}</span>
<span style="font-size: 14px; line-height: 20px; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="color: #FF7480">⇄</span> {{r.tagLine}}</span>
</div>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{showGrid}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{results}}" as="r" hint-placeholder-count="6">
<div style="position: relative; aspect-ratio: 4 / 5; background: #161B2E">
<button onClick="{{r.open}}" aria-label="Открыть объявление" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: none; background: transparent; padding: 0; z-index: 1"></button>
<img src="{{r.img}}" alt="{{r.title}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
<span style="position: absolute; left: 6px; top: 6px; background: {{r.kindBg}}; color: {{r.kindFg}}; border-radius: 999px; padding: 2px 6px; font-size: 12px; line-height: 16px; font-weight: 600">{{r.kind}}</span>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
<div style="padding: 48px 32px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<span style="font-size: 17px; line-height: 24px; font-weight: 700">Ничего не нашлось</span>
<span style="font-size: 15px; line-height: 22px; color: #A3A9C2">Попробуй убрать фильтры или расширить город</span>
</div>
</sc-if>
</div>
</div>
</sc-if>

<!-- Шторка города -->
<sc-if value="{{cityOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: flex-end; z-index: 5">
<button onClick="{{closeCity}}" aria-label="Закрыть" style="flex-grow: 1; border: none; background: transparent; padding: 0"></button>
<div role="dialog" aria-label="Где искать" style="animation: slideUp 220ms ease-out; background: #161B2E; border-radius: 20px 20px 0 0; padding: 8px 16px 24px 16px; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #262C44"></span>
<span style="font-size: 17px; line-height: 24px; font-weight: 700">Где искать</span>
<div style="display: flex; flex-direction: column; border-radius: 10px; background: #0E1220">
<sc-for list="{{cityOpts}}" as="c" hint-placeholder-count="3">
<button onClick="{{c.pick}}" role="radio" aria-checked="{{c.on}}" style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; border: none; border-bottom: 1px solid #262C44; background: transparent; color: #FFFFFF; font-size: 15px; line-height: 22px; font-weight: 500; text-align: left"><span style="display: flex; flex-direction: column"><span>{{c.label}}</span></span><span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 999px; border: 2px solid {{c.ring}}; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 999px; background: {{c.dot}}"></span></span></button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #A3A9C2">Радиус</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{radii}}" as="rr" hint-placeholder-count="4">
<button data-flat="1" onClick="{{rr.pick}}" aria-pressed="{{rr.on}}" style="height: 44px; border-radius: 999px; border: 1px solid {{rr.bd}}; background: {{rr.bg}}; color: {{rr.fg}}; font-size: 14px; line-height: 20px; font-weight: 700; padding: 0">{{rr.label}}</button>
</sc-for>
</div>
</div>
<button onClick="{{toggleOnline}}" role="switch" aria-checked="{{onlineOn}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0; border: none; background: transparent; color: #FFFFFF; text-align: left">
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; line-height: 22px; font-weight: 700">Включать онлайн</span><span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #A3A9C2">Услуги по видеосвязи — из любого города</span></span>
<span style="width: 48px; height: 28px; border-radius: 999px; background: {{onlineTrack}}; position: relative; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{onlineKnob}}; width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF; transition: left 150ms ease"></span></span>
</button>
<button onClick="{{closeCity}}" style="height: 52px; border-radius: 999px; border: none; background: #FF3D4A; color: #12131F; font-size: 15px; line-height: 20px; font-weight: 700">Показать</button>
</div>
</div>
</sc-if>
</div>
</sc-if>

<!-- ================= КАРТОЧКА ОБЪЯВЛЕНИЯ ================= -->
<sc-if value="{{isDetail}}" hint-placeholder-val="{{ false }}">
<div style="animation: slideInR 220ms ease-out; display: flex; flex-direction: column; flex-grow: 1; min-height: 0">
<header style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px 44px; align-items: center; height: 56px; padding: 0 8px; box-sizing: border-box; border-bottom: 1px solid #262C44; flex-shrink: 0">
<button onClick="{{closeDetail}}" aria-label="Назад" style="width: 44px; height: 44px; border: none; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span style="justify-self: center; font-size: 17px; line-height: 24px; font-weight: 700">{{d.kindWord}}</span>
<button onClick="{{d.share}}" aria-label="Поделиться" style="width: 44px; height: 44px; border: none; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"></path></svg></button>

</header>

<div style="flex-grow: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column">
<div style="position: relative; width: 390px; height: 488px; flex-shrink: 0; background: #161B2E">
<img data-hero="1" src="{{d.img}}" alt="{{d.title}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
<span style="position: absolute; right: 16px; top: 16px; background: #0E1220; border-radius: 999px; padding: 4px 8px; font-size: 12px; line-height: 16px; font-weight: 600">1/3</span>
<div style="position: absolute; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; gap: 6px">
<span style="width: 6px; height: 6px; border-radius: 999px; background: #FFFFFF"></span><span style="width: 6px; height: 6px; border-radius: 999px; background: #FFFFFF; opacity: 0.4"></span><span style="width: 6px; height: 6px; border-radius: 999px; background: #FFFFFF; opacity: 0.4"></span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 24px; padding: 16px 16px 24px 16px">
<div style="display: flex; flex-direction: column; gap: 8px">

<span style="background: {{d.kindBg}}; color: {{d.kindFg}}; border-radius: 999px; padding: 4px 8px; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.04em">{{d.kind}}</span>
<sc-if value="{{d.mutual}}" hint-placeholder-val="{{ false }}"><span style="background: #5AC8FA; color: #12131F; border-radius: 999px; padding: 4px 8px; font-size: 12px; line-height: 16px; font-weight: 600">⇄ Взаимно</span></sc-if>
<span style="background: #161B2E; color: #FFFFFF; border-radius: 999px; padding: 4px 8px; font-size: 12px; line-height: 16px; font-weight: 600">{{d.category}}</span>

</div>
<h1 style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 700; letter-spacing: -0.01em">{{d.title}}</h1>
<span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #A3A9C2">{{d.meta}} · опубликовано 2 дня назад</span>
</div>

<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; line-height: 22px; font-weight: 700">Вы подходите друг другу</span><span style="font-size: 14px; line-height: 20px; color: #FFFFFF">Ты можешь фотосъёмку, ей нужна фотосессия. Можно меняться напрямую</span></span>
</div>
</sc-if>

<p style="margin: 0; font-size: 15px; line-height: 22px; color: #FFFFFF">{{d.desc}}</p>
<sc-if value="{{d.isIdea}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; background: #161B2E">
<div style="display: flex; justify-content: space-between; font-size: 15px; line-height: 22px; font-weight: 700"><span style="color: #FF7480">Хотят {{d.wantN}}</span><span style="color: #5AC8FA">Могут {{d.canN}}</span></div>
<div style="display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: #262C44"><span style="width: {{d.wantPct}}; background: #FF3D4A"></span><span style="width: {{d.canPct}}; background: #5AC8FA"></span></div>
<span style="font-size: 14px; line-height: 20px; color: #A3A9C2">{{d.balance}}. По идее нельзя договориться напрямую — нажми «Хочу такое» или «Могу такое», и объявление создастся за секунду.</span>
<button data-flat="1" onClick="{{d.notify}}" aria-pressed="{{d.notifyOn}}" style="height: 44px; border-radius: 999px; border: none; background: {{d.notifyBg}}; color: {{d.notifyFg}}; font-size: 14px; line-height: 20px; font-weight: 700">{{d.notifyLabel}}</button>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #A3A9C2; letter-spacing: 0.04em">{{d.swapTitle}}</span>

<sc-for list="{{d.tags}}" as="t" hint-placeholder-count="2">
<span style="background: #FFFFFF; color: #12131F; border-radius: 999px; padding: 6px 12px; font-size: 14px; line-height: 20px; font-weight: 600">{{t}}</span>
</sc-for>
</div>
</div>

<sc-if value="{{d.notIdea}}" hint-placeholder-val="{{ true }}">

<div style="display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #262C44">
<span style="width: 32px; height: 32px; border-radius: 999px; background: #FFB020; color: #12131F; display: flex; align-items: center; justify-content: center; font-size: 16px; line-height: 20px; font-weight: 800; flex-shrink: 0">Б</span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; line-height: 22px; font-weight: 700">Возможна доплата баллами</span><span style="font-size: 14px; line-height: 20px; color: #A3A9C2">Только баллами: «Доплачу» или «Доплатят» в предложении обмена. Деньгами — нет</span></span>

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3A9C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M7 7h13l-4-4M17 17H4l4 4"></path></svg>
<span style="flex-grow: 1; font-size: 15px; line-height: 22px; color: #A3A9C2">Как передать</span>
<span style="font-size: 15px; line-height: 22px; font-weight: 600">Встреча · Онлайн</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3A9C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"></path></svg>
<span style="flex-grow: 1; font-size: 15px; line-height: 22px; color: #A3A9C2">Где</span>
<span style="font-size: 15px; line-height: 22px; font-weight: 600">{{d.meta}}</span>
</div>
</div>

<button onClick="{{d.openUser}}" aria-label="Открыть профиль автора" style="display: flex; align-items: center; gap: 12px; flex-grow: 1; min-width: 0; padding: 0; border: none; background: transparent; color: #FFFFFF; text-align: left"><span style="width: 48px; height: 48px; border-radius: 999px; background: {{d.avBg}}; color: #12131F; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 24px; font-weight: 800; flex-shrink: 0">{{d.initial}}</span>
<span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<span style="display: flex; align-items: center; gap: 4px; font-size: 14px; line-height: 18px; font-weight: 700">{{d.author}}<svg width="14" height="14" viewBox="0 0 24 24" fill="#5AC8FA" aria-label="Телефон подтверждён"><path d="M12 2l2.4 2.1 3.2-.3.8 3.1 2.8 1.6-1.2 3 1.2 3-2.8 1.6-.8 3.1-3.2-.3L12 22l-2.4-2.1-3.2.3-.8-3.1-2.8-1.6 1.2-3-1.2-3 2.8-1.6.8-3.1 3.2.3z"></path></svg></span>
<span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #A3A9C2">★ {{d.rating}} ({{d.rc}}) · смотреть профиль</span>
</span></button>
<button data-flat="1" onClick="{{d.follow}}" aria-pressed="{{d.followOn}}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: {{d.followBg}}; color: {{d.followFg}}; font-size: 14px; line-height: 20px; font-weight: 700; flex-shrink: 0">{{d.followLabel}}</button>
</div>
</sc-if>
<sc-if value="{{d.isIdea}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #A3A9C2; letter-spacing: 0.04em">КОММЕНТАРИИ · {{d.comN}}</span>
<sc-for list="{{d.comments}}" as="cm" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; align-items: flex-start">
<span style="width: 36px; height: 36px; border-radius: 999px; background: {{cm.bg}}; color: #12131F; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0">{{cm.initial}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 14px; line-height: 18px; font-weight: 700">{{cm.name}} <span style="color: #A3A9C2; font-weight: 500">· {{cm.when}}</span></span><span style="font-size: 15px; line-height: 22px">{{cm.text}}</span></span>
</div>
</sc-for>
<div style="display: flex; align-items: center; gap: 8px; height: 48px; box-sizing: border-box; padding: 0 6px 0 16px; border-radius: 999px; background: #161B2E; border: 1px solid #262C44">

<sc-if value="{{d.hasIc}}" hint-placeholder-val="{{ false }}"><button onClick="{{d.sendIc}}" aria-label="Отправить" style="width: 36px; height: 36px; border-radius: 999px; border: none; background: #FF3D4A; color: #12131F; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"></path></svg></button></sc-if>
</div>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 12px">

</div>

</div>
</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px 32px 16px; border-top: 1px solid #262C44; background: #0E1220; flex-shrink: 0">
